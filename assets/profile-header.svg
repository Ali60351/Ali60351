<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title description">
  <title id="title">Ali Nauman — Senior Full Stack Engineer</title>
  <desc id="description">Angular, TypeScript and Node.js, with a decorative grid inspired by the interfaces Ali builds.</desc>
  <defs>
